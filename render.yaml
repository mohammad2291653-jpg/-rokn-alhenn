# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free, private, read-only preview only. This does not authorize commercial orders.
# Postgres free expires after 30 days; no paid resource or automatic upgrade is declared.
previews:
  generation: "off"

services:
  - type: web
    name: rokn-alhenna-free-preview
    runtime: node
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: >-
      npm ci --include=dev &&
      NEXT_PUBLIC_SITE_URL="$RENDER_EXTERNAL_URL" BETTER_AUTH_URL="$RENDER_EXTERNAL_URL" npm run build
    startCommand: >-
      NEXT_PUBLIC_SITE_URL="$RENDER_EXTERNAL_URL" BETTER_AUTH_URL="$RENDER_EXTERNAL_URL" npm run start:free-preview
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: rokn-alhenna-free-preview-db
          property: connectionString
      - key: FREE_PREVIEW_DATABASE_NAME
        value: rokn_free_preview
      - key: RENDER_FREE_PREVIEW
        value: "true"
      - key: COMMERCIAL_LAUNCH_APPROVED
        value: "false"
      - key: ALLOW_INDEXING
        value: "false"
      - key: STORAGE_DRIVER
        value: disabled
      - key: TRUST_PROXY
        value: "false"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ORDER_TOKEN_SECRET
        generateValue: true
      # generateValue produces standard base64. Preview access requires base64url.
      # Generate securely outside source: randomBytes(48).toString('base64url').
      - key: PREVIEW_ACCESS_TOKEN
        sync: false

databases:
  - name: rokn-alhenna-free-preview-db
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: rokn_free_preview
    user: rokn_free_preview
    plan: free
    ipAllowList: []
