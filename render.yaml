# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Review-only infrastructure proposal. Applying creates PAID resources.
# Do not apply before owner cost approval, Git repository access, and secrets setup.
previews:
  generation: "off"

services:
  - type: web
    name: rokn-alhenna-preview
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: rokn-alhenna-preview-db
          property: connectionString
      # Use Render's ACTUAL assigned HTTPS URL during build and runtime (no guessed host).
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          name: rokn-alhenna-preview
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_URL
        fromService:
          name: rokn-alhenna-preview
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Supply independently generated secrets (48+ chars); keep ORDER_TOKEN_SECRET stable.
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: ORDER_TOKEN_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: COMMERCIAL_LAUNCH_APPROVED
        value: "false"
      - key: ALLOW_INDEXING
        value: "false"
      # Enable only after verifying the deployed proxy overwrites forwarded addresses.
      - key: TRUST_PROXY
        value: "false"

databases:
  - name: rokn-alhenna-preview-db
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: rokn_preview
    user: rokn_preview
    plan: 0.5c-1g
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
